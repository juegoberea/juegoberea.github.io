# Publica el juego en GitHub Pages cada vez que se sube un cambio a la rama main.
# Antes de publicar corre las pruebas: si alguna falla, no se publica nada.
name: Publicar Berea

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Panel de la autora: dirección y clave pública de Supabase (Settings → Secrets and variables → Actions → Variables).
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_CLAVE_PUBLICA: ${{ vars.SUPABASE_CLAVE_PUBLICA }}
          # Juego: dónde buscar contenido nuevo (lo que publica el panel). Es pública.
          VITE_URL_CONTENIDO: ${{ vars.URL_CONTENIDO }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - id: publicacion
        uses: actions/deploy-pages@v4
